name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl-quality:
    name: ETL quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Lint application and tests
        run: ruff check etl dashboard mining tests

      - name: Run deterministic ETL tests with coverage
        run: |
          pytest \
            tests/test_config.py \
            tests/test_quality.py \
            tests/test_transforms.py \
            tests/test_etl_cli.py \
            --cov=etl.config \
            --cov=etl.quality \
            --cov=etl.transforms \
            --cov=etl.etl_pipeline \
            --cov-report=term-missing \
            --cov-report=xml:coverage-etl.xml \
            --cov-fail-under=90

      - name: Run offline dashboard tests and six-page smoke coverage
        env:
          DASHBOARD_MODE: demo
        run: |
          pytest \
            tests/test_dashboard_data.py \
            tests/test_dashboard_app.py \
            --cov=dashboard \
            --cov-report=term-missing \
            --cov-report=xml:coverage-dashboard.xml \
            --cov-fail-under=80

      - name: Run deterministic mining and recommendation tests
        env:
          MPLBACKEND: Agg
        run: |
          pytest \
            tests/test_mining_artifacts.py \
            tests/test_mining_clustering.py \
            tests/test_mining_market_basket.py \
            tests/test_mining_recommendation.py \
            -W error::FutureWarning
